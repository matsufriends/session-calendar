<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session Calendar</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#22322e;background:#f6f7f3}*{box-sizing:border-box}body{margin:0;padding:32px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:28px;letter-spacing:-1px;margin:0 0 8px}.eyebrow{color:#75857c;font-size:12px;letter-spacing:2px;margin-bottom:10px}p{color:#738179;font-size:13px}button,select,input{border:1px solid #dbe1d9;background:white;border-radius:9px;padding:10px 14px;color:inherit}button{cursor:pointer}button:hover{background:#edf2ea}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:20px;flex-wrap:wrap}#range{font-size:19px;font-weight:600;margin:0 15px}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px}.calendar{max-height:72vh;overflow:auto!important}.calendar:not(.list) .days{min-width:760px}.calendar,.detail{border:1px solid #dde3da;border-radius:16px;background:white;overflow:hidden}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.day{min-height:480px;border-right:1px solid #e8ece5;padding:12px 8px}.day:last-child{border:0}.date{font-size:12px;color:#7e8982;padding:5px 4px 15px}.date b{display:block;font-size:23px;color:#334c40;margin-top:7px}.today .date b{color:#247755}.event{display:block;width:100%;text-align:left;padding:10px;margin:0 0 8px;border:0;border-left:3px solid #498876;background:#edf5ef;border-radius:7px;overflow:hidden}.event.Claude{border-color:#ce956b;background:#fbf0e7}.event small{display:block;line-height:1.6;font-size:10px}.event strong{display:block;font-size:12px;line-height:1.5;overflow-wrap:anywhere;margin:5px 0}.detail{padding:22px;align-self:start;min-height:280px}.detail h2{font-size:17px;overflow-wrap:anywhere}.detail dl{font-size:13px}.detail dt{color:#849086;margin-top:20px}.detail dd{margin:6px 0;overflow-wrap:anywhere}#status{font-size:12px;color:#748078;margin:15px 0}.legend{display:flex;gap:16px;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#498876;margin-right:5px}.dot.claude{background:#ce956b}.empty{font-size:11px;color:#aab1aa;padding:8px}.list .days{grid-template-columns:1fr}.list .day{min-height:0;border-right:0;border-bottom:1px solid #eee}.list .date b{display:inline;margin-left:10px}.list .event{max-width:100%}@media(max-width:1000px){body{padding:18px}main{grid-template-columns:1fr}.day{min-height:350px}.detail{min-height:0}}@media(max-width:650px){.calendar{overflow-x:auto}.days{min-width:800px}.list .days{min-width:0}header{align-items:start}.legend{flex-direction:column;gap:8px}}
.calendar:not(.list) .day{position:relative;height:1600px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 63px,#f0f2ed 63px,#f0f2ed 64px);background-position:0 64px}.calendar:not(.list) .date{position:sticky;top:0;height:64px;background:white;z-index:2}.calendar:not(.list) .event{position:absolute;width:calc(100% - 16px);margin:0;min-height:48px;max-height:60px;z-index:1}.calendar:not(.list) .event:hover,.calendar:not(.list) .event:focus{z-index:3;max-height:none;box-shadow:0 4px 18px #0002}.calendar:not(.list) .hour{position:absolute;font-size:9px;color:#adb5ac;left:2px;pointer-events:none}.list .hour{display:none}.list .event{width:100%!important;left:auto!important}.calendar:not(.list) .event{height:48px;min-height:48px;max-height:48px;padding:5px}.calendar:not(.list) .event small:last-child{display:none}</style>
<header><div><div class="eyebrow">YOUR LOCAL WORKSPACE</div><h1>Session Calendar</h1><p>Claude と Codex の作業記録 · Asia/Tokyo</p></div><div class="legend"><span><i class="dot"></i>Codex</span><span><i class="dot claude"></i>Claude</span></div></header>
<div class="toolbar"><button id="prev" aria-label="前の週">←</button><button id="today">今日</button><button id="next" aria-label="次の週">→</button><span id="range"></span><select id="tool" aria-label="ツール"><option>すべて</option><option>Codex</option><option>Claude</option></select><input id="search" placeholder="タイトル・プロジェクト" aria-label="タイトル・プロジェクト検索"><select id="view" aria-label="表示形式"><option value="week">週カレンダー</option><option value="list">週の一覧</option></select><button id="refresh">更新</button></div>
<div id="status">ローカルの履歴を読み込み中…</div><main><section class="calendar" id="calendar"><div class="days" id="days"></div></section><aside class="detail" id="detail"><h2>セッションを選択</h2><p>開始日時・プロジェクト・記録日時を確認できます。</p><p>会話本文は表示しません。終了日時が記録されていない場合は「不明」と表示します。</p></aside></main>
<script>
const $=id=>document.getElementById(id);let sessions=[],anchor=today(),warnings=[];
function today(){return daykey(new Date())}
function daykey(t){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date(t))}
function dt(t){return t?new Date(t).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'不明'}
function offset(d,n){const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function start(){let d=new Date(anchor+'T12:00:00Z').getUTCDay();return offset(anchor,-((d+6)%7))}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function detail(s){$('detail').replaceChildren(node('h2',s.title));const dl=node('dl');for(const [k,v] of [['ツール',s.tool],['プロジェクト',s.project],['開始日時',dt(s.start)],['最後の記録',dt(s.last_activity)],['終了日時','不明'],['セッションID',s.id]]){dl.append(node('dt',k),node('dd',v))}$('detail').append(dl,node('p','最後の記録日時はセッションの終了を意味しません。'))}
function render(){const first=start();$('range').textContent=`${first.replaceAll('-','/')} — ${offset(first,6).slice(5).replace('-','/')}`;$('days').replaceChildren();$('calendar').classList.toggle('list',$('view').value==='list');let count=0;for(let i=0;i<7;i++){const d=offset(first,i),col=node('div',undefined,'day'+(d===today()?' today':'')),head=node('div',['月','火','水','木','金','土','日'][i],'date');head.append(node('b',d.slice(8)));col.append(head);for(let h=0;h<24;h++){const label=node('span',String(h).padStart(2,'0')+':00','hour');label.style.top=(64+h*64)+'px';col.append(label)}const items=sessions.filter(s=>daykey(s.start)===d&&($('tool').value==='すべて'||s.tool===$('tool').value)&&(`${s.title} ${s.project}`.toLowerCase().includes($('search').value.toLowerCase()))).sort((a,b)=>a.start.localeCompare(b.start));count+=items.length;const laneEnds=[],layouts=new Map();for(const s of items){const m=new Date(s.start).getTime()/60000;let lane=laneEnds.findIndex(end=>end<=m);if(lane<0)lane=laneEnds.length;laneEnds[lane]=m+45;layouts.set(s.id,lane)}for(const s of items){const e=node('button',undefined,'event '+s.tool);e.append(node('small',`${dt(s.start).slice(-5)} · ${s.tool}`),node('strong',s.title),node('small',s.project));const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(s.start)).split(':');e.title=s.title+' · '+s.project+' · 終了不明';e.style.width=`calc((100% - 16px) / ${Math.max(1,laneEnds.length)})`;e.style.left=`calc(8px + (100% - 16px) * ${layouts.get(s.id)} / ${Math.max(1,laneEnds.length)})`;e.style.top=(64+(Number(parts[0])+Number(parts[1])/60)*64)+'px';e.onclick=()=>detail(s);col.append(e)}if(laneEnds.length>3&&$('view').value==='week'){col.querySelectorAll('.event').forEach(e=>e.remove());const groups=new Map();for(const s of items){const hour=dt(s.start).slice(-5,-3);if(!groups.has(hour))groups.set(hour,[]);groups.get(hour).push(s)}for(const [hour,group] of groups){const e=node('button',undefined,'event '+(group.every(s=>s.tool==='Claude')?'Claude':'Codex'));e.style.top=(64+Number(hour)*64)+'px';e.append(node('small',hour+':00台'),node('strong',group.length+' 件のセッション'));e.title='開始が密集しています。クリックで選択';e.onclick=()=>{$('detail').replaceChildren(node('h2',d+' '+hour+':00台'));for(const s of group){const b=node('button',undefined,'event '+s.tool);b.append(node('small',dt(s.start).slice(-5)+' · '+s.tool),node('strong',s.title),node('small',s.project));b.onclick=()=>detail(s);$('detail').append(b)}};col.append(e)}}if(!items.length)col.append(node('div','記録なし','empty'));$('days').append(col)}$('status').textContent=`今週 ${count} 件 / 全 ${sessions.length} 件 · ローカル読取専用 · カードは開始位置のみ（高さは所要時間を表しません）${warnings.length?' · '+warnings.join(' / '):''}`}
async function load(refresh=false){$('status').textContent='ローカルの履歴を読み込み中…';try{const r=await fetch('/api/sessions'+(refresh?'?refresh=1':''));if(!r.ok)throw Error();const data=await r.json();sessions=data.sessions;warnings=data.warnings;render()}catch(e){$('status').textContent='履歴を読み込めませんでした。サーバーの起動状態を確認してください。'}}
$('prev').onclick=()=>{anchor=offset(anchor,-7);render()};$('next').onclick=()=>{anchor=offset(anchor,7);render()};$('today').onclick=()=>{anchor=today();render()};['tool','view'].forEach(id=>$(id).onchange=render);$('search').oninput=render;$('refresh').onclick=()=>load(true);load();
</script></html>
