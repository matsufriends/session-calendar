name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path native
      - run: zsh build-mac.sh
      - run: dist/SessionCalendar.app/Contents/MacOS/SessionCalendar --self-test
