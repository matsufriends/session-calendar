name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: swift test --package-path native
      - run: zsh build-mac.sh
      - run: dist/SessionCalendar.app/Contents/MacOS/SessionCalendar --self-test
