name: Release mac app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Check release secrets
        env:
          MORN_NOTARY_TOKEN: ${{ secrets.MORN_NOTARY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          for name in MORN_NOTARY_TOKEN HOMEBREW_TAP_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not set. Register it in the release environment secrets."
              exit 1
            fi
          done

      - name: Build
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native/Support/Info.plist)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" UNIVERSAL=1 zsh build-mac.sh
          dist/SessionCalendar.app/Contents/MacOS/SessionCalendar --self-test

      - name: Sign & notarize via MornNotary
        env:
          # PAT (classic), repo scope, with access to matsufriends/MornNotary.
          GH_TOKEN: ${{ secrets.MORN_NOTARY_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone matsufriends/MornNotary "$RUNNER_TEMP/MornNotary" -- --depth 1
          bash "$RUNNER_TEMP/MornNotary/sign.sh" dist/SessionCalendar.app
          mv dist/SessionCalendar-signed.zip dist/SessionCalendar.app.zip

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/SessionCalendar.app.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/SessionCalendar.app.zip --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(shasum -a 256 dist/SessionCalendar.app.zip | awk '{print $1}')"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/TsukumiStudio/homebrew-tap.git" tap
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git -C tap push --dry-run origin HEAD:main
            echo "Trial completed; release and Homebrew cask were not changed."
            exit 0
          fi
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" packaging/session-calendar.rb.in > tap/Casks/session-calendar.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/session-calendar.rb
          git diff --cached --quiet || { git commit -m "session-calendar ${VERSION}"; git push; }
